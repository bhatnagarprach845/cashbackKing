# Enable the H2 Console
spring.h2.console.enabled=true
# The path where you can access it in the browser
spring.h2.console.path=/h2-console

# Persistence configuration
spring.datasource.url=jdbc:h2:mem:cashback_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Allow Hibernate to create the tables automatically based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Replace us-east-1 and the XXXXX with your actual Region and User Pool ID
aws.cognito.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXX

# AWS Credentials (If not using IAM roles or Default Credentials Chain)
aws.accessKeyId=YOUR_ACCESS_KEY
aws.secretKey=YOUR_SECRET_KEY
aws.region=us-east-1

# S3 Bucket for Receipt Storage
aws.s3.bucket=cashback-king-receipts


# File Upload Limits (Increase for high-res receipt images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Port
server.port=8080

# Logging for Analytics Debugging
logging.level.com.bhatn.cashbackking=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# The Issuer URI for Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX

# JWK Set URI (Spring can usually auto-discover this from the issuer-uri above)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX/.well-known/jwks.json